name: Keep Render Awake

on:
  schedule:
    # Cada 10 min — el plan free de Render se duerme ~15 min sin tráfico
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 60 \
            "https://soluciones-integrales-sitio.onrender.com/health"
